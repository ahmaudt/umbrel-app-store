version: "3.7"

services:
  server:
    image: ghcr.io/ahmaudt/bedebooks:0.1.0
    restart: on-failure
    stop_grace_period: 1m
    # Host networking, like Plex and Home Assistant on Umbrel: DLNA/OpenHome
    # speaker discovery needs multicast, and speakers stream from the host's
    # LAN address. The UI is on port 9333 directly, so there is no app_proxy.
    network_mode: host
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${UMBREL_ROOT}/data/storage/downloads/audiobooks:/audiobooks:ro
